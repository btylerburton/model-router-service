[project]
name = "model-router-service"
version = "0.1.0"
description = "OpenAI-compatible routing proxy that auto-selects the best upstream model per request (LLM judge + deterministic scorer), in front of a USAi-style gateway."
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
# Dependencies use bounded COMPATIBLE RANGES, not single exact pins. Rationale:
# this service must install on whatever Python the host/sandbox ships (observed:
# CPython 3.14 on aarch64). An exact pin like pydantic==2.10.4 has no prebuilt
# wheel for every Python/arch, forcing a from-source Rust build (pydantic-core)
# that fails on images without a C/Rust toolchain. Ranges let the installer pick
# a version that HAS a wheel for the running interpreter while staying bounded
# (upper bound guards against a breaking major). Installs should pass
# --only-binary=:all: so a missing wheel fails fast instead of building from
# source. For a hard-locked build, generate a per-target lockfile (uv.lock) in CI.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
]

[project.scripts]
model-router-service = "model_router_service.__main__:main"
model-router = "model_router_service.cli:main"
model-router-toggle = "model_router_service.toggle:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
